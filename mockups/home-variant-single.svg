<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="2240" viewBox="0 0 1440 2240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style><![CDATA[
      .section { fill: #F8FAFC; stroke: #CBD5E1; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; }
      .muted { fill: #E5E7EB; }
      .line { stroke: #CBD5E1; }
      .heading { font: 700 24px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #0F172A; }
      .sub { font: 600 16px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #0F172A; }
      .text { font: 400 12px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #334155; }
      .eyebrow { font: 600 12px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #0F6CBD; letter-spacing: .08em; }
      .btn { fill: #0F6CBD; }
      .btn-text { font: 600 14px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #FFFFFF; }
      .nav { fill: #E2E8F0; }
      .logo { fill: #0F172A; }
    ]]></style>
  </defs>

  <!-- HEADER -->
  <rect x="0" y="0" width="1440" height="80" fill="#FFFFFF"/>
